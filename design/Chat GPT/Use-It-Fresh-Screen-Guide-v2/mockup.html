<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Use It Fresh — screen direction v2</title></head><body><div id="uif-design">
 <div class="uif-phone"><div class="uif-top"><span>9:41</span><span>● ● ▰</span></div><main></main><nav aria-label="Main navigation"></nav><div class="uif-toast" role="status"></div></div>
 <aside class="uif-board"><div class="uif-eyebrow">USE IT FRESH / DESIGN 02</div><h1>Your kitchen.<br>A little clearer.</h1><p>Revised from the 8 September recording</p><div class="uif-swatches"><span style="background:#07533A">Forest</span><span style="background:#83BD43;color:#173421">Leaf</span><span style="background:#F7F7F0;color:#173421">Cream</span><span style="background:#202826">Graphite</span></div><h3>Explore the screens</h3><div class="uif-screen-links"></div><div class="uif-type"><b>Figtree / Nunito</b><p>Quiet surfaces. Clear actions.<br>Food status always includes words.</p></div><button class="secondary" data-example="1">Show example food / empty kitchen</button><div class="uif-demo-note">Design prototype. Changes stay in this preview.</div></aside>
</div>
<style>
#uif-design{font-family:'Nunito','Segoe UI',sans-serif;color:#202C24;display:flex;gap:44px;align-items:flex-start;justify-content:center;padding:20px 12px;box-sizing:border-box}#uif-design *{box-sizing:border-box}#uif-design button,#uif-design input,#uif-design select{font:inherit}#uif-design button{cursor:pointer}#uif-design button:focus-visible,#uif-design input:focus-visible,#uif-design select:focus-visible{outline:3px solid #5B833C;outline-offset:3px}#uif-design .uif-phone{width:390px;flex-shrink:0;height:800px;position:relative;background:#F7F7F0;border:1px solid #DCE3D7;border-radius:32px;overflow:hidden;box-shadow:0 16px 48px #18351e15}#uif-design .uif-top{height:36px;padding:12px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}#uif-design main{height:679px;overflow:auto;padding:16px 20px 24px;scrollbar-width:thin}#uif-design h1,#uif-design h2,#uif-design h3{font-family:Figtree,'Segoe UI',sans-serif;letter-spacing:-.6px;margin:0}#uif-design h2{font-size:28px;line-height:1.15}#uif-design h3{font-size:18px}#uif-design p{margin:6px 0 16px;line-height:1.5;color:#59665D;font-size:14px}#uif-design .row{display:flex;align-items:center;gap:12px}#uif-design .between{justify-content:space-between}#uif-design .muted{font-size:12px;color:#59665D}#uif-design .eyebrow,#uif-design .uif-eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:800;color:#59665D;margin-bottom:8px}#uif-design svg.icon{width:22px;height:22px;flex-shrink:0}#uif-design .iconbtn{border:1px solid #DCE3D7;background:white;border-radius:15px;width:48px;height:48px;display:grid;place-items:center;color:#07533A}#uif-design .hero{background:#202826;color:white;padding:22px;border-radius:24px;margin:20px 0;position:relative;overflow:hidden}#uif-design .hero:after{content:'';position:absolute;width:140px;height:140px;border:1px solid #ffffff12;border-radius:80% 0;right:-30px;top:-30px;transform:rotate(-22deg)}#uif-design .hero .eyebrow{color:#C1D4B5}#uif-design .hero h2{font-size:25px;max-width:230px}#uif-design .hero p{color:#CED8C9;margin-bottom:16px}#uif-design .primary{width:100%;min-height:48px;border:0;border-radius:12px;background:#07533A;color:white;padding:12px 16px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center}#uif-design .hero .primary{background:#D9E8CD;color:#153C28;width:auto;position:relative;z-index:1}#uif-design .secondary{min-height:48px;background:white;border:1px solid #DCE3D7;border-radius:12px;padding:10px 14px;color:#07533A;font-weight:700}#uif-design .link{border:0;background:none;color:#07533A;font-weight:700;min-height:44px;padding:8px}#uif-design .section{margin-top:20px;margin-bottom:10px}#uif-design .food-row{display:flex;gap:12px;align-items:center;width:100%;border:1px solid #E2E7DC;background:#fff;padding:12px;border-radius:18px;margin:8px 0;text-align:left;color:inherit;min-height:88px}#uif-design .food-row strong{font-size:15px}#uif-design .food-copy{flex:1;min-width:0}#uif-design .food-art{width:55px;height:60px;border-radius:15px;background:#EDF2E8;display:grid;place-items:center;flex-shrink:0}#uif-design .food-art svg{width:42px;height:42px}#uif-design .badge{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:800;border-radius:8px;padding:4px 6px;margin-top:6px}#uif-design .badge svg{width:12px;height:12px}#uif-design .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}#uif-design .stat{background:#EDF2E8;padding:13px 10px;border-radius:15px;font-size:11px;color:#4B5C4E}#uif-design .stat b{display:block;color:#253D2A;font-size:22px;margin-bottom:4px}#uif-design .recipe{padding:18px;background:#EAF0E2;border-radius:20px;border:1px solid #DCE6D2}#uif-design .recipe h3{max-width:220px}#uif-design .recipe .art{width:65px;height:65px;background:#fff9;border-radius:50%;display:grid;place-items:center;color:#07533A}#uif-design .recipe .art svg{width:34px;height:34px}#uif-design nav{position:absolute;bottom:0;left:0;right:0;height:84px;display:flex;justify-content:space-around;align-items:flex-start;padding:10px 7px 16px;background:#fff;border-top:1px solid #DCE3D7}#uif-design nav button{width:65px;min-height:54px;border:0;border-radius:14px;background:none;color:#59665D;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:11px;font-weight:600}#uif-design nav button.active{color:#07533A;background:#EDF2E8;font-weight:800}#uif-design nav button.scan{background:#07533A;color:white;width:56px;height:56px;border-radius:18px}#uif-design .chips{display:flex;gap:7px;overflow:auto;margin:14px 0;padding:2px 0 5px}#uif-design .chips button{border:1px solid #DCE3D7;background:white;border-radius:12px;min-height:44px;white-space:nowrap;padding:8px 13px;font-size:12px;color:#435649}#uif-design .chips button.active{background:#07533A;border-color:#07533A;color:white}#uif-design .search{display:flex;align-items:center;gap:8px;background:white;border:1px solid #DCE3D7;border-radius:13px;padding:0 12px;margin-top:20px;height:48px}#uif-design .search input{border:0;background:none;min-width:0;flex:1;outline-offset:0}#uif-design label{display:block;font-size:12px;font-weight:700;margin:15px 0 6px}#uif-design input.field,#uif-design select{width:100%;min-height:48px;border:1px solid #C9D4C4;border-radius:12px;padding:10px 12px;background:#fff;color:#202C24}#uif-design .note{padding:13px;border-radius:14px;background:#EDF2E8;font-size:12px;line-height:1.5;color:#47594A;margin:14px 0}#uif-design .warn{background:#FFF1D4;color:#79500F}#uif-design .danger{background:#FCE8E6;color:#A02929}#uif-design .options button{width:100%;margin:8px 0;text-align:left;display:flex;align-items:center;gap:14px;padding:16px;border:1px solid #DCE3D7;border-radius:18px;background:white;color:#202C24;min-height:76px}#uif-design .options small{display:block;margin-top:5px;color:#59665D}#uif-design .options button>svg{color:#07533A}#uif-design .divider{height:1px;background:#DCE3D7;margin:18px 0}#uif-design .detail-art{height:140px;border-radius:22px;background:#EAF0E2;display:grid;place-items:center;margin:18px 0}#uif-design .detail-art svg{width:95px;height:95px}#uif-design .kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #E1E7DC;font-size:13px;gap:12px}#uif-design .kv span{color:#59665D}#uif-design .twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}#uif-design .avatar{width:60px;height:60px;border-radius:20px;background:#07533A;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}#uif-design .shopping-row{display:flex;align-items:center;gap:12px;padding:16px 12px;background:white;border:1px solid #DCE3D7;border-radius:15px;margin:8px 0;min-height:62px}#uif-design .shopping-row input{width:22px;height:22px;accent-color:#07533A}#uif-design .bars{height:160px;display:flex;gap:18px;align-items:end;padding:20px 14px 30px;background:white;border-radius:18px;margin:16px 0}#uif-design .bars div{flex:1;background:#A8C48D;border-radius:6px 6px 0 0;position:relative}#uif-design .bars span{position:absolute;bottom:-22px;left:0;font-size:11px;color:#59665D}#uif-design .uif-board{max-width:340px;padding-top:30px}#uif-design .uif-board h1{font-size:35px;line-height:1.15;letter-spacing:-1px}#uif-design .uif-swatches{display:flex;gap:8px;margin:26px 0}#uif-design .uif-swatches span{width:72px;height:78px;border-radius:16px;display:flex;align-items:end;justify-content:center;padding:10px 3px;color:white;font-size:11px;border:1px solid #DCE3D7}#uif-design .uif-screen-links{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 28px}#uif-design .uif-screen-links button{min-height:44px;padding:10px 13px;background:#fff;border:1px solid #DCE3D7;border-radius:12px;color:#07533A}#uif-design .uif-type{border-top:1px solid #DCE3D7;padding-top:22px}#uif-design .uif-demo-note{font-size:12px;color:#59665D;margin-top:24px}#uif-design .uif-toast{position:absolute;bottom:95px;left:20px;right:20px;padding:12px;background:#202826;color:white;border-radius:12px;font-size:13px;display:none;z-index:5}@media(max-width:740px){#uif-design{flex-direction:column;align-items:center;gap:20px}#uif-design .uif-board{padding-top:0;width:100%;max-width:390px}#uif-design .uif-board h1{font-size:26px}#uif-design .uif-phone{width:min(390px,100%)}}

#uif-design .empty-kitchen{background:#EDF2E8;border-radius:24px;padding:26px 20px 14px;text-align:center;margin:12px 0 22px}
#uif-design .empty-kitchen h2{font-size:25px;line-height:1.2}#uif-design .empty-kitchen p{margin:14px 0 22px}
#uif-design .empty-art{width:64px;height:64px;border-radius:20px;background:#fff;display:grid;place-items:center;margin:0 auto 18px;color:#07533A}
#uif-design .empty-art svg{width:34px;height:34px}
#uif-design .setup-strip{display:flex;width:100%;align-items:center;gap:12px;border:1px solid #DCE3D7;background:#fff;border-radius:16px;padding:14px 12px;text-align:left;color:#07533A;margin:22px 0 24px}
#uif-design .setup-strip span{flex:1;font-size:14px;font-weight:700}#uif-design .setup-strip small{display:block;font-size:12px;font-weight:400;color:#59665D;margin-top:4px}
#uif-design .quick-tile{display:flex;flex-direction:column;gap:9px;align-items:flex-start;border:1px solid #DCE3D7;background:#fff;padding:18px 14px;border-radius:18px;color:#07533A;min-height:120px;text-align:left}
#uif-design .quick-tile strong{font-size:14px}#uif-design .quick-tile small{font-size:12px;color:#59665D}
#uif-design .segments{display:flex;gap:4px;background:#E8EDE2;padding:4px;border-radius:14px;margin:26px 0}
#uif-design .segments button{flex:1;min-height:48px;border:0;border-radius:10px;background:transparent;font-size:12px;color:#435649;padding:8px}
#uif-design .segments .chosen{background:#fff;color:#07533A;font-weight:700}
#uif-design label{font-size:14px;margin-top:24px}#uif-design input.field{font-size:16px;min-height:54px}
#uif-design .consent{display:flex;gap:12px;align-items:flex-start;font-weight:400;margin:24px 0}#uif-design .consent input{width:20px;height:20px;accent-color:#07533A}#uif-design .consent small{display:block;font-size:11px;line-height:1.4;color:#59665D;margin-top:4px}
</style>
<script>
(()=>{
const root=document.getElementById('uif-design'),main=root.querySelector('main'),nav=root.querySelector('nav');
const paths={"home": "M3 10 12 3 21 10M5 9v12h5v-7h4v7h5V9", "inventory": "M6 3h12v18H6zM6 9h12M9 5v2m0 5v3", "scan": "M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5M7 12h10M12 7v10", "recipes": "M5 4h5c1 0 2 1 2 2 0-1 1-2 2-2h5v15h-5c-1 0-2 1-2 2 0-1-1-2-2-2H5zM12 6v15", "profile": "M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2", "shopping": "M3 3h2l3 12h11l2-9H6M9 20h.01M18 20h.01", "bell": "M6 17V9a6 6 0 0 1 12 0v8l2 2H4zM10 22h4", "arrow": "m9 5 7 7-7 7", "back": "m15 5-7 7 7 7", "clock": "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM12 7v5l3 2", "check": "m5 12 4 4L19 6", "warning": "M12 3 2 21h20zM12 9v5m0 3v1", "snow": "M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 3 3-3M9 20l3-3 3 3", "search": "M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Zm-2 5 6 6", "leaf": "M4 20C2 8 9 3 21 3c0 12-5 18-17 17Zm0 0L16 8", "household": "M15 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM5 21v-3a7 7 0 0 1 14 0v3M3 7a3 3 0 0 0 0 6m18-6a3 3 0 0 1 0 6", "insights": "M4 21V11m8 10V3m8 18V7", "camera": "M3 6h5l2-3h4l2 3h5v15H3zM16 13a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z", "receipt": "M5 2v20l3-2 4 2 4-2 3 2V2l-3 2-4-2-4 2zM8 8h8m-8 4h8m-8 4h5", "barcode": "M3 4v16m4-16v16m3-16v16m4-16v16m3-16v16m4-16v16", "plus": "M12 4v16M4 12h16", "help": "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM9 8a3 3 0 0 1 6 1c0 2-3 2-3 4m0 3v1", "trash": "M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7", "settings": "M4 7h16M4 17h16M8 4v6m8 4v6"};
const icon=(n)=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]||paths.leaf}"/></svg>`;
const art=(n)=> n==='Mushrooms'?'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M26 31h13v22H26z" fill="#DDCCB1"/><path d="M10 33C10 6 54 6 54 33Z" fill="#A38C6A"/><circle cx="24" cy="24" r="3" fill="#EADDC6"/><circle cx="40" cy="21" r="4" fill="#EADDC6"/></svg>':n.includes('Yoghurt')?'<svg viewBox="0 0 64 64" aria-hidden="true"><path d="m15 17 5 38h25l5-38" fill="#FFF" stroke="#BBCDC5" stroke-width="2"/><path d="M12 12h40v8H12z" fill="#83BD43"/><path d="M21 32h24v14H21z" fill="#DCEBCD"/></svg>':icon(n.includes('Peas')?'snow':n.includes('Chicken')?'warning':'leaf');
const styles={'Fresh':['#285B34','#EAF3E5','leaf'],'Use Soon':['#79500F','#FFF1D4','clock'],'Use Today':['#934017','#FFEADD','clock'],'Past Use By':['#A02929','#FCE8E6','warning'],'Frozen':['#275E85','#E7F2FA','snow'],'Unknown':['#59615D','#EDF0ED','help']};
let items=[{name:'Baby spinach',qty:'1 bag',loc:'Fridge',status:'Use Soon',date:'Best-before · 8 Sep',source:'Printed date'},{name:'Mushrooms',qty:'250 g',loc:'Fridge',status:'Use Soon',date:'Window ends 9 Sep · estimate',source:'App estimate'},{name:'Greek Yoghurt',qty:'500 g',loc:'Fridge',status:'Use Today',date:'Use-by · 6 Sep',source:'Printed date'},{name:'Peas',qty:'1 bag',loc:'Freezer',status:'Frozen',date:'Frozen · 1 Sep',source:'User entered'},{name:'Chicken breast',qty:'400 g',loc:'Fridge',status:'Past Use By',date:'Use-by · 5 Sep',source:'Printed date'}];
let example=false; let page='Home',filter='All',selected=0,shopping=[{name:'Pasta',qty:'250 g',source:'Spinach & mushroom pasta',done:false}],scanType='Item photo',toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=s=>{let [c,b,i]=styles[s]||styles.Unknown;return `<span class="badge" style="color:${c};background:${b}">${icon(i)}${s}</span>`};
function toast(s){const t=root.querySelector('.uif-toast');t.textContent=s;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2500)}
function head(title,sub=''){return `<div class="row between"><div><div class="eyebrow">OUR HOUSEHOLD</div><h2>${title}</h2></div><button class="iconbtn" data-go="Shopping" aria-label="Shopping list">${icon('shopping')}</button></div>${sub?`<p>${sub}</p>`:''}`}
function back(title){return `<div class="row"><button class="iconbtn" data-go="${page==='Recipe'?'Recipes':'Inventory'}" aria-label="Back">${icon('back')}</button><h3>${title}</h3></div>`}
function food(x){const i=items.indexOf(x);return `<button class="food-row" data-item="${i}"><div class="food-art">${art(x.name)}</div><div class="food-copy"><strong>${esc(x.name)}</strong><div class="muted">${esc(x.qty)} · ${x.loc}</div>${badge(x.status)}<div class="muted" style="margin-top:5px">${x.date}</div></div>${icon('arrow')}</button>`}
function recipe(){return `<div class="recipe"><div class="row between"><div><div class="eyebrow">FROM YOUR FRIDGE</div><h3>Spinach & mushroom pasta</h3></div><div class="art">${icon('recipes')}</div></div><p>Uses 2 items from your use-first list.</p><div class="row between"><span class="muted">20 min · Easy · 1 missing</span><button class="link" data-go="Recipe">View recipe →</button></div></div>`}
function inventoryList(){if(!example)return '<div class="empty-kitchen"><div class="empty-art">'+icon('inventory')+'</div><h2>Your kitchen,<br>all in one place.</h2><p>Keep track of your fridge, freezer and pantry.</p><button class="primary" data-go="Scan/Add">Add your first item</button></div>';return items.filter(x=>(filter==='All'||x.loc===filter||(filter==='Use first'&&['Use Soon','Use Today'].includes(x.status)))).filter(x=>x.name.toLowerCase().includes((root.querySelector('#uif-search')?.value||'').toLowerCase())).map(food).join('')||'<div class="note">No items here yet. Add your first item using Scan/Add.</div>'}
function render(){
nav.innerHTML=['Home','Inventory','Scan/Add','Recipes','Profile'].map((x,i)=>`<button class="${x===page?'active ':''}${i===2?'scan':''}" data-go="${x}" ${x===page?'aria-current="page"':''}>${icon(['home','inventory','scan','recipes','profile'][i])}<span>${x}</span></button>`).join('');
if(page==='Home')main.innerHTML=head('Good morning, Ash.','Let’s make the most of what’s in your kitchen.')+`<button class="setup-strip" data-go="Setup">${icon('profile')}<span>Make it yours <small>Finish your profile when you’re ready</small></span>${icon('arrow')}</button><div class="row between section"><h3>Use first</h3>${example?'<button class="link" data-go="Inventory">See all</button>':''}</div>${example?items.slice(0,2).map(food).join(''):`<div class="empty-kitchen"><div class="empty-art">${icon('inventory')}</div><h2>A fresh start<br>for your kitchen.</h2><p>Add a few things you already have.<br>We’ll help you see what to use next.</p><button class="primary" data-go="Scan/Add">${icon('plus')} Add your first item</button><button class="link" data-scan="Add manually">Or enter it manually</button></div>`}<h3 class="section">Quick add</h3><div class="twocol"><button class="quick-tile" data-scan="Item photo">${icon('camera')}<strong>Take a photo</strong><small>Review before saving</small></button><button class="quick-tile" data-scan="Barcode">${icon('barcode')}<strong>Scan barcode</strong><small>Packaged food</small></button></div>${example?'<h3 class="section">Make something good</h3>'+recipe():`<button class="food-row" data-go="Household">${icon('household')}<div><strong>Share your kitchen</strong><div class="muted">Invite the people you cook with</div></div>${icon('arrow')}</button>`}`;
else if(page==='Inventory')main.innerHTML=head('Your food.',`${example?items.length:0} items · fridge, freezer & pantry`)+`<div class="search">${icon('search')}<input id="uif-search" aria-label="Search inventory" placeholder="Find something in your kitchen"></div><div class="chips">${['All','Fridge','Freezer','Pantry','Use first'].map(x=>`<button data-filter="${x}" class="${filter===x?'active':''}">${x}</button>`).join('')}</div><div class="row between"><span class="muted">Dates and estimates shown separately</span></div><div id="uif-food-list">${inventoryList()}</div>`;
else if(page==='Scan/Add')main.innerHTML=head('What are we adding?','A quick photo, a barcode, or a few words.')+`<div class="options">${[['camera','Item photo','One product or a package'],['barcode','Barcode','Find a packaged product'],['receipt','Receipt','Review several purchases together'],['inventory','Fridge photo','Find visible items in your fridge'],['plus','Add manually','No camera needed']].map(([i,t,s])=>`<button data-scan="${t}">${icon(i)}<span><strong>${t}</strong><small>${s}</small></span>${icon('arrow')}</button>`).join('')}</div><div class="note">You’ll review every suggestion before anything is added.</div><p class="muted">Only scan food and packaging you want to add.</p>`;
else if(page==='Review')main.innerHTML=back('Review before adding')+`<div class="section"><h2>${scanType==='Add manually'?'Add an item.':'Found something fresh.'}</h2><p>${scanType==='Add manually'?'Enter the details you know.':'Sample scan result · check and correct the details.'}</p></div><label for="uif-name">Item name</label><input class="field" id="uif-name" value="Tomatoes"><label for="uif-qty">Quantity</label><input class="field" id="uif-qty" value="4 items"><label for="uif-store">Store in</label><select id="uif-store"><option>Fridge</option><option>Pantry</option><option>Freezer</option></select><div class="note warn">${icon('help')} No printed date identified. Add a date if the package has one. A photo does not establish food safety.</div><div class="kv"><span>Name source</span><b>${scanType==='Add manually'?'You':'AI suggestion · medium confidence'}</b></div><div class="kv"><span>Date status</span><b>Unknown · needs checking</b></div><div style="margin-top:20px"><button class="primary" data-save-item="1">Confirm & add item</button></div>`;
else if(page==='Detail'){let x=items[selected];main.innerHTML=back('Item details')+`<div class="detail-art">${art(x.name)}</div><div class="row between"><h2>${esc(x.name)}</h2>${badge(x.status)}</div><p>${esc(x.qty)} · ${x.loc}</p>${x.status==='Past Use By'?'<div class="note danger">Past the printed use-by date. Excluded from meal suggestions.</div>':''}<div class="kv"><span>Date</span><b>${x.date}</b></div><div class="kv"><span>Source</span><b>${x.source}</b></div><div class="kv"><span>Opened</span><b>${x.opened?'Recorded today':'Not recorded'}</b></div><div class="note">Food care guide<br><b>Check the storage instructions on the package.</b><br>Keep opening dates and storage history up to date.</div><div class="twocol"><button class="secondary" data-opened="1">Mark opened</button><button class="primary" data-consumed="1">Consumed</button></div><button class="link" data-go="Assessment">Is this still good? →</button>`}
else if(page==='Recipes')main.innerHTML=head('Make the most of it.','Start with what you already have.')+`<div class="chips"><button class="active">Use first</button><button data-toast="Saved recipes will appear here">Saved</button><button data-toast="Time filter: under 30 minutes">Under 30 min</button></div>${recipe()}<div class="note">Your preferences<br><b>2 servings · vegetarian ideas</b><br>Always check ingredient labels for allergens.</div><button class="secondary" style="width:100%" data-go="Shopping">${icon('shopping')} Open shopping list</button>`;
else if(page==='Recipe')main.innerHTML=back('Recipe')+`<div class="detail-art">${icon('recipes')}</div><h2>Spinach & mushroom pasta</h2><p>20 min · Easy · 2 servings</p><div class="note">Estimated nutrition: 420 kcal per serving. Check all ingredient labels against your allergies.</div><h3>Already in your kitchen</h3><div class="kv">Baby spinach <b>1 bag</b></div><div class="kv">Mushrooms <b>250 g</b></div><h3 class="section">Still needed</h3><div class="kv">Pasta <b>250 g</b></div><button class="primary" style="margin-top:20px" data-add-shopping="1">Add missing ingredient</button><p class="muted" style="margin-top:16px">Recipe detail concept. Cooking steps and any critical-step flags appear below the ingredient list in the full design.</p>`;
else if(page==='Shopping')main.innerHTML=head('Shopping list.','Shared with your household')+shopping.map((x,i)=>`<label class="shopping-row"><input type="checkbox" data-shopping="${i}" ${x.done?'checked':''}><span style="${x.done?'text-decoration:line-through':''}"><b>${x.name}</b> · ${x.qty}<span class="muted" style="display:block">From ${x.source}</span></span></label>`).join('')+`<div class="note">Purchased items stay here until you choose to add them to inventory.</div>`;
else if(page==='Profile')main.innerHTML=head('Your space.')+`<div class="row section"><div class="avatar">A</div><div><h3>Ash</h3><span class="muted">Our household · Owner</span></div></div><div class="options">${[['household','Household','Members, invitations and activity','Household'],['shopping','Shopping list','Your shared list','Shopping'],['insights','Your impact','Estimated savings and waste avoided','Insights'],['bell','Reminders','Timing and quiet hours','Reminders'],['settings','Preferences','Diet, allergies, units and privacy','Preferences']].map(([i,t,s,g])=>`<button data-go="${g}">${icon(i)}<span><strong>${t}</strong><small>${s}</small></span>${icon('arrow')}</button>`).join('')}</div>`;
else if(page==='Insights')main.innerHTML=head('Small changes add up.','September · estimates from sample activity')+`<div class="hero"><div class="eyebrow">ESTIMATED VALUE SAVED</div><h2>$24.80</h2><p>Based on items marked consumed and estimated values.</p></div><div class="twocol"><div class="stat"><b>1.8 kg</b>Estimated waste avoided this month</div><div class="stat"><b>7.2 kg</b>Estimated waste avoided all time</div></div><h3 class="section">Items consumed</h3><div class="bars">${[42,68,54,90].map((h,i)=>`<div style="height:${h}%"><span>W${i+1}</span></div>`).join('')}</div><div class="note">Your most discarded category is leafy greens. Buying a smaller bag could help.</div>`;
else if(page==='Assessment')main.innerHTML=back('Is this still good?')+`<h2 class="section">Let’s check what you know.</h2><p>A photo alone cannot tell us whether food is safe.</p><div class="note warn">${icon('help')} <b>Insufficient information</b><br>Complete the storage and date questions before an assessment.</div><div class="kv"><span>Confidence</span><b>Low · incomplete history</b></div><div class="kv"><span>Evidence available</span><b>Item name and recorded date</b></div><div class="kv"><span>Missing information</span><b>Opening date; storage history</b></div><div class="options"><button data-toast="Questionnaire: opening date, storage history and condition">${icon('help')} Answer the missing questions ${icon('arrow')}</button></div><p class="muted">Use It Fresh provides general food-management guidance, not a guarantee of safety. When in doubt—especially with high-risk food—throw it out and follow local food-safety advice.</p>`;
else if(page==='Setup')main.innerHTML=back('Your profile')+`<div class="section"><div class="eyebrow">A LITTLE ABOUT YOU</div><h2>Make yourself<br>at home.</h2><p>A name is all you need to get started.</p></div><label for="profile-name">What should we call you?</label><input class="field" id="profile-name" autocomplete="given-name" placeholder="Your name"><p class="muted" style="margin-top:8px">This is how you’ll appear in your household.</p><label class="consent"><input type="checkbox" id="profile-age"><span>I’m 18 or older </span></label><button class="primary" data-profile-save="1">Save profile</button><button class="link" data-go="Home" style="width:100%;margin-top:8px">Do this later</button>`;
else if(page==='Household'||page==='Join')main.innerHTML=back('Your household')+`<div class="section"><div class="eyebrow">BETTER TOGETHER</div><h2>One kitchen.<br>Everyone in sync.</h2><p>Share food, shopping and what needs using.</p></div><div class="segments"><button data-go="Household" class="${page==='Household'?'chosen':''}">Create a household</button><button data-go="Join" class="${page==='Join'?'chosen':''}">Join with a code</button></div>${page==='Household'?`<label for="household-name">Household name</label><input class="field" id="household-name" placeholder="e.g. Our kitchen"><p class="muted" style="margin-top:8px">You can invite others after creating it.</p><button class="primary" data-house-create="1">Create household</button>`:`<label for="join-code">Invite code</label><input class="field" id="join-code" placeholder="Enter your invite code" autocomplete="off"><p class="muted" style="margin-top:8px">Ask someone in your household for their code.</p><button class="primary" data-join="1">Join household</button>`}<div class="note">${icon('household')} Already have a personal kitchen? Keep your food there until you choose to share it.</div>`;
else if(page==='Household-old')main.innerHTML=head('Our household.','One kitchen, a shared view.')+`<div class="food-row"><div class="avatar">A</div><div><strong>Ash</strong><p style="margin:0">Owner</p></div></div><button class="primary" data-toast="Invite form: choose email or a shareable link">Invite a member</button><h3 class="section">Recent activity</h3><div class="note">You added mushrooms.<br><span class="muted">Sample activity · today</span></div>`;
else if(page==='Reminders')main.innerHTML=head('Reminders.','Helpful nudges, on your schedule.')+`<label class="shopping-row"><input type="checkbox" checked> Approaching dates</label><label class="shopping-row"><input type="checkbox" checked> Opened-item reminders</label><label for="quiet">Quiet hours begin</label><input id="quiet" class="field" type="time" value="21:00"><label for="quiet-end">Quiet hours end</label><input id="quiet-end" class="field" type="time" value="08:00"><button class="primary section" data-toast="Preferences changed in this preview">Save preferences</button>`;
else main.innerHTML=head('Preferences.')+`<div class="options">${['Dietary preferences','Allergies','Units & region','Privacy & image retention','Export your data','Delete account'].map(x=>`<button data-toast="${x}: detailed flow specified in the handoff">${icon('settings')}${x}${icon('arrow')}</button>`).join('')}</div>`;
nav.style.display=['Setup','Household','Join','Review'].includes(page)?'none':'flex';main.style.height=['Setup','Household','Join','Review'].includes(page)?'764px':'679px';main.scrollTop=0;
}
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.example){example=!example;render()}else if(b.dataset.profileSave){if(!root.querySelector('#profile-name').value.trim()){toast('Please enter your name');return}toast('Profile saved in this preview');page='Home';render()}else if(b.dataset.houseCreate){if(!root.querySelector('#household-name').value.trim()){toast('Please enter a household name');return}toast('Household created in this preview');page='Home';render()}else if(b.dataset.join){toast(root.querySelector('#join-code').value.trim()?'Example only: FF connects the invitation check':'Please enter an invite code')}else if(b.dataset.go){page=b.dataset.go;render()}else if(b.dataset.first){page='Inventory';filter='Use first';render()}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.item!==undefined){selected=+b.dataset.item;page='Detail';render()}else if(b.dataset.scan){scanType=b.dataset.scan;page='Review';render()}else if(b.dataset.saveItem){const name=root.querySelector('#uif-name').value.trim();if(!name){toast('Add an item name first');return}example=true;items.push({name,qty:root.querySelector('#uif-qty').value||'1 item',loc:root.querySelector('#uif-store').value,status:'Unknown',date:'Date not recorded',source:'User reviewed'});page='Inventory';filter='All';render();toast('Added to this preview')}else if(b.dataset.opened){items[selected].opened=true;render();toast('Opening date recorded in preview')}else if(b.dataset.consumed){items.splice(selected,1);page='Inventory';render();toast('Marked consumed in preview')}else if(b.dataset.addShopping){if(!shopping.some(x=>x.name==='Pasta'))shopping.push({name:'Pasta',qty:'250 g',source:'Spinach & mushroom pasta',done:false});page='Shopping';render();toast('Missing ingredient is on your list')}else if(b.dataset.toast)toast(b.dataset.toast)});
root.addEventListener('input',e=>{if(e.target.id==='uif-search')root.querySelector('#uif-food-list').innerHTML=inventoryList()});root.addEventListener('change',e=>{if(e.target.dataset.shopping!==undefined){shopping[+e.target.dataset.shopping].done=e.target.checked;render()}});
root.querySelector('.uif-screen-links').innerHTML=['Home','Inventory','Scan/Add','Setup','Household','Profile','Recipes'].map(x=>`<button data-go="${x}">${x}</button>`).join('');render();
})();
</script>
</body></html>
